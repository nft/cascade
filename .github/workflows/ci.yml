name: CI

# Checks every pull request and every push to main. The release workflow runs
# it as well, so a tag only ships a commit that passes.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its running checks. Runs for main and
# for release tags always finish, so each of those commits gets a verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Installs the toolchain go.mod pins, the one the release builds use.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # main.go embeds frontend/dist, so the Wails shell package compiles only
      # once the frontend has been built.
      - name: Build the frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Check formatting
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            while IFS= read -r file; do
              echo "::error file=$file::Not gofmt-formatted. Run gofmt -w $file"
            done <<< "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  app:
    name: App frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run check

      - name: Test
        run: bun run test

  site:
    name: Website
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run check

      - name: Test
        run: bun run test

      # The build pages.yml deploys, with its base path, so a pull request that
      # would break the site fails here instead of after the merge.
      - name: Build
        run: bun run build
        env:
          BASE_PATH: /cascade
          GITHUB_TOKEN: ${{ github.token }}

  workflows:
    name: Workflows
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The image bundles shellcheck, which also checks every run script.
      - name: Lint the workflow files
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
