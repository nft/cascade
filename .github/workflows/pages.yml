name: Pages

on:
  push:
    branches: [main]
    # The site, and what it reads at build time: the changelog it renders as
    # patch notes. A change to the desktop app alone does not publish.
    paths:
      - 'web/**'
      - 'CHANGELOG.md'
      - '.github/workflows/pages.yml'
  # Also started by the release workflow, so the download buttons pick up the
  # files it just published.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys queue instead of cancelling: a half-applied Pages deployment would
# leave the live site mixing old and new assets.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # https://nft.github.io/cascade serves the site from the repository's
  # sub-path; SvelteKit wants it without a trailing slash. Moving to a custom
  # domain means setting this to '' and updating SITE_ORIGIN in
  # web/src/lib/config/site.ts, which canonical and og:url are built from.
  BASE_PATH: /cascade

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Test
        run: bun run test

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build
        run: bun run build
        env:
          # Prerendering asks the GitHub API for the latest release; the token
          # keeps that call clear of the anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Action inputs are not affected by `defaults.run.working-directory`.
          path: web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
