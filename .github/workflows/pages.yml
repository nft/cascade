name: Pages

on:
  push:
    branches: [main]
    # Only the marketing/docs site is deployed from here; a change to the
    # desktop app must not trigger a publish.
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys queue instead of cancelling: a half-applied Pages deployment would
# leave the live site mixing old and new assets.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # https://nft.github.io/cascade/ — vite.config.ts already defaults to this,
  # but naming it here makes the deployed base visible. Moving to a custom
  # domain means setting this to '/' AND updating SITE_URL in
  # web/src/data/site.ts, which is what canonical and og:url are built from.
  BASE_PATH: /cascade/

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Test
        run: bun run test

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # Actions sets CI=true, which switches the local fhtml plugin
      # (web/plugins/fhtml.ts) into denyWarnings mode: a template warning that
      # is only logged during `bun run dev` fails the build here.
      - name: Build
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Action inputs are not affected by `defaults.run.working-directory`.
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
